# Sandbox override — names/ports/volumes isolated from prod
# Explicit project name = hardening: without it the project name derives from
# the directory, so renaming the dir (or running from a copy) would silently
# share a project namespace with prod. Value matches the current dir-derived
# name, so this is a no-op for the existing deployment (no recreation).
name: reqcore-sandbox

services:
  db:
    container_name: reqcore_sandbox_db
    ports: !override
      - "127.0.0.1:5433:5432"
    volumes: !override
      - postgres_data_sandbox:/var/lib/postgresql/data
  minio:
    container_name: reqcore_sandbox_minio
    ports: !override
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes: !override
      - minio_data_sandbox:/data
  app:
    container_name: reqcore_sandbox_app
    ports: !override
      # Loopback only: all traffic must come through host nginx
      - "127.0.0.1:3100:3000"
    environment:
      # Rate limiter: host nginx (published-port DNAT) arrives from the bridge
      # gateway. If the gateway IP drifts (network recreation), trust fails
      # CLOSED -> shared-bucket fallback, same as before this change.
      TRUSTED_PROXY_IP: 172.19.0.1
      # Raised for the e2e suite (~15 applies/run from one IP). Sandbox only.
      RATE_LIMIT_APPLY_MAX_REQUESTS: 50
      # Raised so the full e2e suite from one IP is not throttled mid-run.
      # Still bounded; sandbox only, never prod.
      RATE_LIMIT_GLOBAL_WRITE_MAX: 500
      RATE_LIMIT_AUTH_WRITE_MAX: 200
  adminer:
    profiles: ["never"]
# Pinned so the bridge gateway (TRUSTED_PROXY_IP above) can't drift when
# networks are recreated in a different order.
networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
volumes:
  postgres_data_sandbox:
  minio_data_sandbox:
